# ════════════════════════════════════════════════════════════════════
#  RUBRICALO — API GATEWAY
#  api.rubricalo.com → Node.js Express (puerto 4000)
# ════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    server_name api.rubricalo.com;

    ssl_certificate     /etc/letsencrypt/live/rubricalo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rubricalo.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 100M;
    proxy_read_timeout   300s;

    location / {
        # Preflight OPTIONS: respond with CORS headers and 204
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ════════════════════════════════════════════════════════════════════
#  RUBRICALO — DOCUSEAL ENGINE (Protegido con Autenticación Básica)
#  docuseal.rubricalo.com → Motor DocuSeal (puerto 3500)
# ════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    server_name docuseal.rubricalo.com;

    ssl_certificate     /etc/letsencrypt/live/rubricalo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rubricalo.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 100M;
    proxy_read_timeout   300s;

    # Protección con credenciales de SuperAdmin
    auth_basic           "Acceso Restringido - Rubrícalo SuperAdmin";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass         http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ════════════════════════════════════════════════════════════════════
#  RUBRICALO — ONLYOFFICE DOCUMENT SERVER (Protegido con Autenticación Básica)
#  docs.rubricalo.com → OnlyOffice (puerto 8081)
# ════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    server_name docs.rubricalo.com;

    ssl_certificate     /etc/letsencrypt/live/rubricalo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rubricalo.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 100M;
    proxy_read_timeout   300s;

    # Protección con credenciales de SuperAdmin
    auth_basic           "Acceso Restringido - Rubrícalo SuperAdmin";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

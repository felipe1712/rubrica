    }
}

# ════════════════════════════════════════════════════════════════════
#  RUBRICALO — STIRLING PDF / HERRAMIENTAS PDF (Protegido con Autenticación Básica)
#  pdf.rubricalo.com → Stirling-PDF (puerto 8080)
# ════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    server_name pdf.rubricalo.com;

    ssl_certificate     /etc/letsencrypt/live/rubricalo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rubricalo.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 100M;
    proxy_read_timeout   300s;

    # Protección con credenciales de SuperAdmin
    auth_basic           "Acceso Restringido - Rubrícalo SuperAdmin";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location ~* /classic-logo/.*\.svg$ {
        alias /opt/rubricalo/server/stirling/customFiles/HerramientasPDFLogo.svg;
        default_type image/svg+xml;
        add_header Content-Type image/svg+xml;
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_hide_header  X-Frame-Options;
        add_header         X-Frame-Options "ALLOW-FROM https://app.rubricalo.com" always;
        add_header         Content-Security-Policy "frame-ancestors 'self' https://app.rubricalo.com" always;
    }
}


# ════════════════════════════════════════════════════════════════════
#  NGINX — Configuración Multi-Sitio  rubricalo.com
#  /etc/nginx/sites-available/rubricalo.conf
#
#  Stack Rúbricalo  (nuevo, /opt/rubricalo/server/)
#    app.rubricalo.com       →  127.0.0.1:3003  (Frontend React)
#    api.rubricalo.com       →  127.0.0.1:4000  (API Gateway)
#    admin.rubricalo.com     →  127.0.0.1:3003  (Panel admin /admin/*)
#    docuseal.rubricalo.com  →  127.0.0.1:3500  (DocuSeal Engine - Protegido)
#    pdf.rubricalo.com       →  127.0.0.1:8080  (Stirling PDF - Protegido)
#    docs.rubricalo.com      →  127.0.0.1:8081  (OnlyOffice Server - Protegido)
#    portainer.rubricalo.com →  127.0.0.1:9443  (Portainer Docker - Protegido)
# ════════════════════════════════════════════════════════════════════

# ─── HTTP → HTTPS redirect ──────────────────────────────────────────
server {
    listen 80;
    server_name rubricalo.com www.rubricalo.com app.rubricalo.com api.rubricalo.com admin.rubricalo.com docuseal.rubricalo.com pdf.rubricalo.com docs.rubricalo.com portainer.rubricalo.com;
    return 301 https://$host$request_uri;
}

# ════════════════════════════════════════════════════════════════════
#  RUBRICALO — LANDING PAGE COMERCIAL (PÚBLICA)
#  rubricalo.com & www.rubricalo.com → Estático /opt/rubricalo/server/landing
# ════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    server_name rubricalo.com www.rubricalo.com;

    ssl_certificate     /etc/letsencrypt/live/rubricalo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rubricalo.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    root /opt/rubricalo/server/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ════════════════════════════════════════════════════════════════════
#  RUBRÍCALO — DASHBOARD DEL CLIENTE (APLICACIÓN REACT)
#  app.rubricalo.com → Frontend React (puerto 3003)
# ════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    server_name app.rubricalo.com;

    ssl_certificate     /etc/letsencrypt/live/rubricalo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rubricalo.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    client_max_body_size 100M;
    proxy_read_timeout   300s;

    location / {
        proxy_pass         http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

